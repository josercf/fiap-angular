<h2>Listar produtos a partir da service</h2>
<a href="/produtos/novo">Criar Produto</a>
<ul>
  @for (produto of produtos; track produto.id) {
    <li>{{ produto.nome }} - R$ {{ produto.preco }}
        <input type="button" (click)="remover(produto.id)" value="remover" />  | 
        <button (click)="editar(produto.id)">Editar</button>
    </li>
  }
</ul>
